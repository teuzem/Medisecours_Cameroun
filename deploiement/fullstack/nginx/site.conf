# site.conf — configuration nginx COMPLÈTE de ton application
#
# OÙ POSER CE FICHIER :
#   Ubuntu + paquet nginx → /etc/nginx/sites-available/medisecours.conf
#   puis :                sudo ln -s /etc/nginx/sites-available/medisecours.conf \
#                                 /etc/nginx/sites-enabled/
#   (Debian/Ubuntu, le fichier /etc/nginx/nginx.conf finit par
#    `include /etc/nginx/sites-enabled/*.conf;` DANS le bloc http.)
#   Distribution sans `sites-enabled` → /etc/nginx/conf.d/medisecours.conf
#   (équivalent, inclus depuis le bloc http lui aussi).
#
# ⚠ TOUT ce fichier se trouve dans le bloc `http` de nginx : les directives
#   `map`, `gzip`, `server`… y sont donc autorisées. En revanche `events {}` ou
#   `user` N'IRONT PAS ICI (elles appartiennent au bloc racine de nginx.conf).
#
# RÔLE DE NGINX (à relire avant tout) :
#   1. point d'entrée UNIQUE d'Internet (80/443) ;
#   2. terminaison TLS (il présente le certificat, les conteneurs restent en HTTP) ;
#   3. ajout des en-têtes de sécurité et compression gzip ;
#   4. reverse proxy : il RE-transmet chaque requête vers 127.0.0.1:<port du
#      conteneur>, et renvoie la réponse au navigateur.
#   Rien d'autre ne doit écouter publiquement sur le serveur.

# `map` : transforme la valeur de l'en-tête `Upgrade` en valeur `Connection`.
# Le protocole WebSocket demande au client "Upgrade: websocket". nginx, par défaut,
# N'EFFACE PAS les en-têtes de connexion : il faut dire quoi mettre dans
# `Connection`, qui doit valoir "upgrade" si (et seulement si) un Upgrade est présent.
# Sans ce bloc : le handshake échoue, et le client affiche
# "la connexion a échoué" alors que le service tourne.
# `default upgrade` = un Upgrade présent  → header "upgrade" (on autorise le basculement)
# `'' close`         = pas de Upgrade      → header "close"     (fermeture après réponse,
#                                          comportement normal HTTP/1.1)
# ⚠ À placer dans le bloc `http` : ici c'est le cas, car ce fichier est inclus
#   depuis ce bloc. Si nginx te dit "map directive is not allowed here", déplace
#   ces 4 lignes dans /etc/nginx/nginx.conf juste avant `include .../*.conf;`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# COMPRESSION gzip — envoye des réponses 3 à 5 fois plus légères.
# `gzip_types` : on ne compresse PAS le JSON par défaut, il faut le lister.
# `gzip_min_length` : au-delà de 256 octets seulement — compresser une réponse de
# 50 octets gaspille du CPU pour gagner 20 octets.
# `gzip_vary` : indique au navigateur (et aux caches) que la réponse dépend de
# l'en-tête Accept-Encoding, sinon un cache peut renvoyer la mauvaise variante.

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;


# EN-TÊTES DE SÉCURITÉ — appliqués à TOUTES les réponses passant par nginx.
# C'est ici (et pas dans l'application) qu'on les pose : un seul endroit à
# maintenir, et impossible de les oublier dans une nouvelle route.
#   X-Content-Type-Options : interdit au navigateur de "deviner" un type MIME
#                            (empêche un .txt uploadé d'être exécuté comme du JS).
#   X-Frame-Options        : refuse que ton site soit intégré dans un <iframe>
#                            d'un autre site (protection anti-clickjacking).
#   Referrer-Policy        : n'envoie l'URL d'origine qu'aux sites de destination,
#                            pas à tous les tiers — fuite d'URL parfois fatale.
#   Permissions-Policy     : coupe caméra/micro/geolocalisation sur tes pages.
# ⚠ Ces 4 valeurs valent pour une app "classique". Si tu utilises du framing
#   interne (ex : ouvrir un widget), retire X-Frame-Options et mets une CSP
#   `frame-ancestors` à la place. Le HTTPS est obligatoire pour HSTS.
#   HSTS (Strict-Transport-Security) : à ajouter UNIQUEMENT après avoir vérifié
#   que tout ton domaine est bien en HTTPS (sinon tu bloques l'accès HTTP pendant
#   la durée du header — et on ne peut PAS le révoquer facilement) :
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# `server_tokens off` : nginx ne dévoie plus "nginx/1.24.0" dans les en-têtes et
# les pages d'erreur. Moins d'informations pour un scanner qui cherche une version
# connue vulnérable. Directive du bloc http → elle s'applique à tous les serveurs.
server_tokens off;

# SERVEUR 80 — le port HTTP classique
# Deux rôles : (1) servir le défi ACME de certbot, (2) renvoyer en HTTPS.
server {
    listen 80;
    listen [::]:80;              # IPv6 aussi : sinon une partie des clients échoue
    server_name {{DOMAINE}} {{DOMAINE_API}} {{DOMAINE_WS}};

    # Challenge Let's Encrypt
    # Certbot prouve que tu possèdes le domaine en déposant un fichier de test
    # sur ton serveur, puis en le relisant depuis l'extérieur.
    # Ce location DOIT passer AVANT la redirection 301 (nginx prend le premier
    # location qui correspond ; si la redirection venait en premier, la validation
    # serait redirigée et Let's Encrypt échouerait).
    # Le dossier est partagé avec certbot (mode webroot) : certbot écrit ici,
    # nginx lit ici.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;    # → /var/www/certbot/.well-known/acme-challenge/<fichier>
        # Pas de header de sécurité ici : ce n'est que du texte brut lu par le bot.
    }

    # Redirection permanente vers HTTPS 
    # 301 = "déplacé de façon permanente" : le navigateur met l'URL en cache et
    # n'en refera plus jamais la version HTTP. Tu pourras donc ne plus jamais
    # servir de HTTP.
    # `$host` = domaine demandé par le client (sécurisé, contrairement à un
    # en-tête Host qu'on recopierait tel quel) ; `$request_uri` = chemin + query.
    location / {
        return 301 https://$host$request_uri;
    }
}

# SERVEUR 443 — HTTPS, tout le trafic réel
server {
    listen 443 ssl http2;         # HTTP/2 : multiplexe les requêtes sur une seule
                                  # connexion — pages avec 30 ressources ~30% plus
                                  # rapides qu'en HTTP/1.1.
                                  # ⚠ Sur nginx ≥ 1.25, cette syntaxe affiche un
                                  # avertissement déprécié et on écrirait
                                  # `listen 443 ssl;` + `http2 on;` sur une ligne
                                  # suivante. Ubuntu 24.04 fournit nginx 1.24 :
                                  # la syntaxe ci-dessus est la seule valide, et
                                  # elle reste acceptée (avec warning) sur 1.25+.
    listen [::]:443 ssl http2;
    server_name {{DOMAINE}} {{DOMAINE_API}} {{DOMAINE_WS}};

    # Certificats TLS 
    # Chemin CONVENTIONNEL de certbot : /etc/letsencrypt/live/<PREMIER_DOMAINE>/.
    # Si tu as demandé un certificat couvrant plusieurs noms
    #   (certbot --nginx -d {{DOMAINE}} -d {{DOMAINE_API}} -d {{DOMAINE_WS}})
    # il n'y a QU'UN seul dossier, nommé d'après le premier `-d`.
    # ⚠ Si tu changes de domaine principal, change les deux chemins ci-dessous.
    ssl_certificate     /etc/letsencrypt/live/{{DOMAINE}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAINE}}/privkey.pem;

    # Réglages TLS modernes 
    # TLS 1.2 et 1.3 seulement : TLS 1.0/1.1 sont obsolètes (dépréciés en 2021).
    # Cipher liste "intermédiaire" de la Mozilla SSL Configuration Generator —
    # compatible avec tous les navigateurs des 5 dernières années.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;    # cache de session 10 Mo → réutilisation
    ssl_session_timeout 1d;              # poignées de main réutilisées pendant 1 jour
    ssl_session_tickets off;

    # Corps de requête (UPLOADS) 
    # Limite de la TAILLE d'une requête envoyée à nginx.
    # ⚠ nginx compte aussi les en-têtes : si ton backend accepte 20 Mo mais que
    # nginx dit 10m, l'upload est REJETÉ ICI avec une 413 et le backend ne voit
    # JAMAIS la requête. Les trois valeurs doivent s'accorder :
    #   1) ce fichier-ci                 : client_max_body_size
    #   2) Dockerfile.backend-php        : upload_max_filesize / post_max_size (PHP)
    #   3) ta config applicative         : MAX_UPLOAD_SIZE (Python/Java/Node)
    # Choisis entre 10m (fichiers moyens) et 50m (documents volumineux) — au-delà,
    # c'est le timeout qui devient le problème, pas la taille.
    client_max_body_size 20m;
    client_body_timeout 60s;      # 60 s pour ENVOYER le corps (connexions lentes)

    # Logs 
    access_log /var/log/nginx/{{NOM_PROJET}}-access.log;
    error_log  /var/log/nginx/{{NOM_PROJET}}-error.log warn;

    # ROUTE 1 — / → FRONTEND (SPA ou SSR)
    location / {
        # proxy_pass SANS bloc URI (pas de "/" après le port) : nginx passe
        # l'URL COMPLÈTE telle quelle (ex : /produits/42 reste /produits/42).
        proxy_pass http://127.0.0.1:{{PORT_FRONTEND}};

        # En-têtes transmis au backend
        # `Host` d'origine : le conteneur doit savoir que le visiteur est arrivé
        # sur {{DOMAINE}} (sinon il croirait être sur "localhost:3000" et
        # générerait de mauvais liens / renverrait une mauvaise page).
        proxy_set_header Host $host;
        # X-Forwarded-For : la VRAIE IP du client. Sans lui, tout le monde arrive
        # avec l'IP 127.0.0.1 (celle de nginx) → ton système anti-abus, tes logs
        # et ton rate-limiting deviennent inutiles.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto : "la requête est arrivée en HTTPS". Le conteneur, lui,
        # ne parle qu'en HTTP : sans cet en-tête, l'app générerait des liens
        # http:// et les cookies "secure" ne seraient jamais posés.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket : ce bloc est INCONDITIONNEL (il ne change rien pour une
        # requête HTTP normale) et il permet à / de supporter du SSE/WebSocket
        # monté sur le même chemin.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;   # ← valeur du `map` du haut

        # Buffers : laisser respirer les réponses volumineuses (HTML pré-rendu).
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # ROUTE 2 — /api/ → BACKEND (API REST)
    location /api/ {
        # ⚠ SI TON BACKEND EST EN NODE : c'est exactement la même ligne, seul le
        #   port change (déjà le cas ici : {{PORT_BACKEND}} = 8000 par défaut).
        #   Vérifie simplement que ton Express/Nest écoute sur 0.0.0.0:8000 et non
        #   sur 127.0.0.1:3000 : sinon nginx ne reçoit JAMAIS de réponse → 502.
        proxy_pass http://127.0.0.1:{{PORT_BACKEND}};

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Temps maximal d'ATTENTE d'une réponse du backend. 60 s = généreux pour
        # une API (une requête qui dépasse 60 s a un problème à traiter côté code).
        # Si l'API fait des exports longs, monte à 300s — mais surveille : chaque
        # requête lourde OCCUPE un worker nginx pendant tout ce temps.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Le préfixe /api/ EST CONSERVÉ : ton API reçoit /api/utilisateurs, pas
        # /utilisateurs. Pour le RETIRER (API montée à la racine), écris :
        #   location /api/ { proxy_pass http://127.0.0.1:{{PORT_BACKEND}}/; }
        #   (un "/" APRÈS le port = "remplace le préfixe par rien")
        # Choisis UNE des deux conventions et reste cohérent dans ton code.
        #
        # ⚠ client_max_body_size est hérité du bloc server (20m) : on le rappelle
        #   ici pour rendre la chose VISIBLE à l'endroit où se font les uploads.
        client_max_body_size 20m;
    }

    # ROUTE 3 — /ws → SERVICE WEBSOCKETS (optionnel, profil "ws")
    # Le WebSocket COMMENCE par une requête HTTP normale, puis le client demande
    # « passe en mode WebSocket » via les en-têtes Upgrade/Connection. nginx doit
    # explicitement AUTORISER ce basculement et surtout NE PAS couper la connexion
    # qui reste ouverte des heures.
    #
    # ┌─ Si ces 3 lignes manquent ─────────────────────────────────────────────┐
    # │ 1) proxy_http_version 1.1   : HTTP/1.0 (le défaut de proxy_pass) ne    │
    # │    supporte PAS le keep-alive ni Upgrade → handshake refusé.            │
    # │ 2) proxy_set_header Upgrade  : transmet la demande de basculement.      │
    # │ 3) proxy_set_header Connexion: la valeur issue du `map` du haut.        │
    # │ Sans elles : «Erreur de connexion à wss://…» côté client.              │
    # └─────────────────────────────────────────────────────────────────────────┘
    location /ws {
        proxy_pass http://127.0.0.1:{{PORT_WS}};

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # ⚠ proxy_read_timeout = délai SANS ACTIVITÉ au bout duquel nginx COUPE
        # la connexion (60 s par défaut). Une connexion WebSocket ouverte « pour
        # toujours » mais silencieuse serait donc tuée toutes les minutes.
        # 60 s est volontairement plus long que le heartbeat de 25-30 s recommandé
        # dans langages/websockets.md : le ping/pong arrive AVANT l'expiration.
        # Si ton service n'a PAS de heartbeat, monte ce délai (ex : 3600s) — mais
        # préfère ajouter un heartbeat : une connexion morte qui reste ouverte
        # consomme un worker nginx et de la RAM pour rien.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Buffering désactivé : nginx ne doit JAMAIS mettre en cache ou assembler
        # les trames, sinon les messages temps réel arrivent en retard par paquets
        # de 4k — catastrophique pour un chat.
        proxy_buffering off;
    }

    # FICHIERS STATIQUES (optionnel mais recommandé pour /media, /uploads)
    # Servir images/PDF directement par nginx = 0 % de CPU backend, et les
    # fichiers restent servis même si l'API est en redémarrage.
    # Le chemin ci-dessous est un CHEMIN DU SERVEUR HÔTE. Si tes médias vivent
    # dans un volume Docker, monte-le sur l'hôte (ex : /srv/{{NOM_PROJET}}/uploads
    # dans docker-compose.yml) et mets ce chemin ici.
    location /media/ {
        alias /srv/{{NOM_PROJET}}/uploads/;
        expires 30d;                 # navigateur garde le fichier 30 jours (cache)
        add_header Cache-Control "public, immutable";
        access_log off;              # ne pas polluer les logs avec 1 fichier/visite
        # Pas de try_files ici : avec `alias`, nginx renvoie déjà un 404 tout seul
        # si le fichier n'existe pas (et try_files + alias a historiquement des
        # comportements bizarres sur les locations en expression régulière).
    }

    # Bloque l'accès aux fichiers cachés partout ailleurs (.git, .env, .htaccess) :
    # un .env contenant des mots de passe doit être inaccessible même si quelqu'un
    # devine son URL.
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# NOTES FINALES
# 1. Un seul fichier server sur 443 = un seul certificat = une seule chose à
#    renouveler. Si tu ajoutes un second domaine, préfère UN certificat couvrant
#    les plusieurs noms (certbot --nginx -d a -d b -d c) plutôt qu'un serveur par
#    domaine.
# 2. `location /` est pris en DERNIER ressort : nginx teste d'abord les
#    correspondances EXACTES, puis les préfixes les plus longs (/media/ avant /),
#    puis les expressions régulières. /api/ et /ws l'emportent donc sur /.
# 3. Après chaque modification :
#       sudo nginx -t        # syntaxe (SANS cet essai, un simple ";" manquant
#                            # fait TOMBER TOUT le site au rechargement)
#       sudo systemctl reload nginx   # rechargement sans couper les connexions
