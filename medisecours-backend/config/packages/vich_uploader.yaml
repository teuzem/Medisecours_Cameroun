vich_uploader:
    db_driver: orm
    mappings:
        media_object:
            upload_destination: '%kernel.project_dir%/var/uploads/media'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

when@prod:
    vich_uploader:
        metadata:
            cache: none
