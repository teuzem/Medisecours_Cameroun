name: Deploy to Coolify

# Optional CI-driven deployment. Coolify's native GitHub integration
# (pull on push) is the simplest option; use this workflow instead if you
# prefer to trigger deployments by firing Coolify's webhook URLs.
#
# Set repository secrets before first use:
#   COOLIFY_WEBHOOK_BACKEND  -> Coolify deploy webhook URL for the backend app
#   COOLIFY_WEBHOOK_FRONTEND -> Coolify deploy webhook URL for the frontend app
#   COOLIFY_WEBHOOK_WS       -> Coolify deploy webhook URL for the WS app
#
# In Coolify, each Application has a "Webhooks" tab that exposes the URL.
#
# NOTE: the `secrets` context is NOT available inside step-level `if:`
# conditionals (GitHub Actions context restrictions), which made every run
# of this workflow fail before reaching curl. The emptiness check is done in
# the shell instead, where the secret is passed through `env`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Coolify deployments
    runs-on: ubuntu-latest
    steps:
      - name: Backend
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_BACKEND not set; skipping backend trigger."
            exit 0
          fi
          curl -sS --fail --max-time 60 \
            --retry 3 --retry-delay 5 \
            -X GET "$WEBHOOK"

      - name: Frontend
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_FRONTEND }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_FRONTEND not set; skipping frontend trigger."
            exit 0
          fi
          curl -sS --fail --max-time 60 \
            --retry 3 --retry-delay 5 \
            -X GET "$WEBHOOK"

      - name: WebSocket
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_WS }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK_WS not set; skipping websocket trigger."
            exit 0
          fi
          curl -sS --fail --max-time 60 \
            --retry 3 --retry-delay 5 \
            -X GET "$WEBHOOK"
